[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidal-web"
version = "0.1.0"
description = "Tidal-current energy web visualisation (Philippine archipelago)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ian Panganiban", email = "hi@lkpanganiban.com" }]
keywords = ["tidal", "energy", "geospatial", "web"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "flask>=3.0",
    "numpy>=2.0",
    "scipy>=1.10",
    "xarray>=2023.1",
    "pyyaml>=6.0",
    "fiona>=1.9",
    "affine>=2.4",
    "numba>=0.59",
    "rasterio>=1.3",
    "pillow>=10.0",
    "gunicorn>=21.0",
    "netCDF4>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
    "mypy",
    "black",
]

[project.scripts]
tidal-web = "web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]
# Notebooks are tutorials with cell idioms (trailing ';' to suppress output,
# inline imports) that conflict with lint rules; keep ruff focused on code.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
explicit_package_bases = true
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
exclude = ["output/", "build/"]
