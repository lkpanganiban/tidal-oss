[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidal-model"
version = "0.1.0"
description = "Open-source tidal-current energy assessment workflow for the Philippine archipelago"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ian Panganiban", email = "hi@lkpanganiban.com" }]
keywords = ["tidal", "energy", "hydrodynamics", "shallow-water", "geospatial", "telemac"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "xarray>=2023.1",
    "pyyaml>=6.0",
    "netCDF4>=1.6",
    "rasterio>=1.3",
    "fiona>=1.9",
    "affine>=2.4",
    "numba>=0.59",
]

[project.optional-dependencies]
web = ["flask>=3.0", "pillow>=10.0", "gunicorn>=21.0"]
notebooks = ["jupyter>=1.0", "matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "black>=24"]

[project.scripts]
tidal-model = "model.run:main"
tidal-web = "web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/model/tests", "src/web/tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]
extend-exclude = ["docs", "data", "output", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is enforced by the formatter (ruff format)

[tool.ruff.lint.per-file-ignores]
# Tests intentionally place a warnings.filterwarnings() call before imports
# so they can also run standalone (without pytest).
"src/model/tests/*.py" = ["E402"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
exclude = ["docs/", "data/", "output/", "build/"]
