name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check src downloader.py scripts/generate_test_data.py
      - name: Ruff format check
        run: ruff format --check src downloader.py scripts/generate_test_data.py

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install mypy
      - name: Mypy
        run: mypy src/model src/web

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install GDAL system deps (rasterio/fiona)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev gcc g++
      - name: Install package + dev deps
        run: |
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest
      - name: Smoke-test model CLI (synthetic run)
        run: |
          python -m model.run --duration-days 1 --resolution-km 10 \
            --tidal-source synthetic --output-dir output_ci
