# Tidal web visualisation — single-service compose.
#
#   docker compose up -d          # Flask + MapLibre map
#   docker compose build          # rebuild after code changes

services:
  tidal-web:
    build:
      context: .
      dockerfile: src/Dockerfile
    image: tidal-model:latest
    container_name: tidal-web
    ports:
      - "8001:5000"
    volumes:
      - ./output:/output
    environment:
      - OUTPUT_DIR=/output
      - GEOTIFF_PATH=/output/tidal_power_density.tif
    restart: unless-stopped
