version: "3.9"

services:
  # ---- Phase A: Hydrodynamic Simulation ----
  thetis:
    image: tidal-thetis:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.thetis
    entrypoint: ["/opt/firedrake/bin/python"]
    command: /data/scripts/run_thetis.py
    volumes:
      - ./simulation:/data
    working_dir: /data
    environment:
      - OMPI_MCA_btl_vader_single_copy_mechanism=none
      - OMP_NUM_THREADS=1
    deploy:
      resources:
        limits:
          cpus: "${THETIS_CPUS:-8}"
          memory: 32g
    shm_size: "2gb"
    profiles:
      - simulation

  thetis-shell:
    image: tidal-thetis:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.thetis
    entrypoint: ["/opt/firedrake/bin/python"]
    command: ["-c", "print('Thetis shell ready. Use: docker compose run --rm thetis-shell /bin/bash')"]
    volumes:
      - ./simulation:/data
    working_dir: /data
    environment:
      - OMPI_MCA_btl_vader_single_copy_mechanism=none
    stdin_open: true
    tty: true
    profiles:
      - dev

  # ---- Phase B: Web Visualization ----
  geoserver:
    image: docker.osgeo.org/geoserver:2.25.2
    environment:
      - CORS_ENABLED=true
      - INSTALL_EXTENSIONS=true
      - STABLE_EXTENSIONS=cog-plugin
      - GEOSERVER_ADMIN_USER=admin
      - GEOSERVER_ADMIN_PASSWORD=geoserver
    ports:
      - "${GEOSERVER_PORT:-8080}:8080"
    volumes:
      - ./geoserver_data:/opt/geoserver_data
      - ./simulation/output:/opt/geoserver_data/data/phil_tidal_energy:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/geoserver/ows?service=WMS&version=1.3.0&request=GetCapabilities"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  flask-api:
    build:
      context: ./api
      dockerfile: ../docker/Dockerfile.api
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - ./simulation/output:/data:ro
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - OUTPUT_DIR=/data
      - GEOSERVER_URL=http://geoserver:8080/geoserver
    depends_on:
      geoserver:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - flask-api
      - geoserver
